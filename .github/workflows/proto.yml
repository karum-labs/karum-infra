name: Protos

on:
  push:
    branches: [main]
    paths:
      - "proto/**"
      - "tools/**"
      - "contract/**"
      - "fixtures/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/proto.yml"
  pull_request:
    branches: [main]
    paths:
      - "proto/**"
      - "tools/**"
      - "contract/**"
      - "fixtures/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/proto.yml"

permissions:
  contents: read

jobs:
  lint:
    name: Buf Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.73.0"

      - name: Lint protos
        run: buf lint
        working-directory: proto

  breaking:
    name: Breaking Change Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need full history to diff against main.
          fetch-depth: 0

      - name: Set up buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.73.0"

      # Compare against the commit the push replaced, or the PR base. The
      # helper script materialises that commit with `git worktree` because
      # buf's `.git#branch=...` reference resolves to the repository root
      # while the buf module lives in proto/. It skips cleanly when no base
      # is available — e.g. the very first push to a branch.
      - name: Check breaking changes against base
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE_SHA"
          else
            BASE="$BEFORE_SHA"
          fi
          python3 scripts/breaking.py --base "$BASE"

  contract:
    name: Stubs and Contract Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.73.0"

      - name: Install protobuf runtime
        run: python -m pip install --disable-pip-version-check -r contract/pyrelay/requirements.txt

      # PLAN.md §4: the generate step runs inside Docker so laptop and CI
      # stubs match. The image tag tracks BUF_VERSION in versions.env.
      - name: Generate stubs inside Docker
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace/proto \
            bufbuild/buf:1.73.0 generate
          # The container writes as root. The next steps write into the same
          # tree as the runner, so hand it back.
          if [ -d gen ]; then sudo chown -R "$(id -u):$(id -g)" gen; fi

      - name: Enforce proto provenance markers
        run: make check-proto-docs

      - name: Contract round-trip through both stubs
        run: make contract-test

      - name: Go tests (doccheck and round-trip runners)
        run: go test ./...

  fixtures:
    name: Fixture Pack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The presets have two owners: the recording in fixtures/ and the
      # gateway catalogue in the private sibling repo. The default token
      # cannot read a private sibling, so the checkout is allowed to fail;
      # without it the comparison reports "skipped" and the other fixture
      # checks still run.
      - name: Checkout karum-server (preset catalogue)
        id: server
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: karum-labs/karum-server
          path: _siblings/karum-server
          token: ${{ secrets.SERVER_REPO_TOKEN || secrets.FIXTURE_REPO_TOKEN || github.token }}

      # The pack is committed; regeneration needs the local recordings, which
      # CI does not have, so it verifies hashes, preset schemas, and the
      # projection unit tests instead.
      - name: Unit-test the redaction projections
        run: make test-fixtures

      - name: Verify pack hashes and preset schemas
        run: make check-fixtures

      # Compare the scenario of record with the catalogue the gateway runs.
      # The script exits non-zero on any drift and skips cleanly when the
      # sibling is absent.
      - name: Compare recorded presets with the gateway catalogue
        run: python fixtures/tools/check_presets.py --repo-root _siblings
