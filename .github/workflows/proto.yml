name: Protos

on:
  push:
    branches: [main]
    paths:
      - "proto/**"
      - ".github/workflows/proto.yml"
  pull_request:
    branches: [main]
    paths:
      - "proto/**"
      - ".github/workflows/proto.yml"

permissions:
  contents: read

jobs:
  lint:
    name: Buf Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.73.0"

      - name: Lint protos
        run: buf lint
        working-directory: proto

  breaking:
    name: Breaking Change Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need full history to diff against main.
          fetch-depth: 0

      - name: Set up buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.73.0"

      # Compare against the commit the push replaced, or the PR base. The
      # helper script materialises that commit with `git worktree` because
      # buf's `.git#branch=...` reference resolves to the repository root
      # while the buf module lives in proto/. It skips cleanly when no base
      # is available — e.g. the very first push to a branch.
      - name: Check breaking changes against base
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE_SHA"
          else
            BASE="$BEFORE_SHA"
          fi
          python3 scripts/breaking.py --base "$BASE"
