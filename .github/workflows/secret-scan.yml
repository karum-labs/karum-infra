name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the scan can cover the whole repository.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          # Point the action at the project config that adds Qloo and GCP rules.
          GITLEAKS_CONFIG: .gitleaks.toml
          # No license token needed for public repos with the action's default
          # behaviour; set GITHUB_TOKEN from the workflow automatically.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
