# Karum demo VM stack. The laptop does not use this file.
#
# `make local` starts the same processes on the machine with no Docker.
# `make demo-refresh` copies the sibling repos onto karum-demo and runs
# `docker compose up` there. Caddy is the public HTTPS endpoint.
#
# Postgres is POSTGRES_DSN (an external database). Redis runs only in this
# Compose file, as the VM's cache.
#
# Every service builds from its sibling repo directory (../<repo>), so the
# VM keeps the same layout as the laptop:
#
#   /opt/karum/
#     karum-infra/      (this repo)
#     karum-server/
#     karum-service-taste/
#     karum-service-ai/

name: karum

services:
  # --- Redis: cache for Qloo responses and geocodes. ----------------------
  redis:
    image: redis:7-alpine
    # Persist across restarts within the compose lifecycle.
    restart: unless-stopped
    # Only expose to other services, not the host, unless debugging.
    ports: []
    healthcheck:
      # redis-cli ping returns PONG; -e quiets the banner.
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # --- service-taste: Qloo integration, caching, taste scoring. ----------
  # No `ports:` block on purpose: the HTTP and gRPC listeners stay on the
  # Compose network, so the Qloo quota and the cache are not reachable from
  # the host or the internet. Only the gateway publishes a port (Caddy
  # terminates TLS for it).
  service-taste:
    build:
      context: ../karum-service-taste
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # The fixture pack ships in this repo; the container has no sibling
      # checkout, so the pack is mounted read-only and the service points at
      # it (TASTE_FIXTURES_DIR below).
      - ./fixtures:/fixtures:ro
    environment:
      # Fixture mode makes no outbound Qloo calls; set TASTE_QLOO_API_KEY and
      # TASTE_MODE=live to hit the real API. The key stays server-side only.
      # These override .env so the container dials compose service names.
      TASTE_PORT: "8081"
      TASTE_MODE: ${TASTE_MODE:-fixture}
      TASTE_FIXTURES_DIR: /fixtures
      TASTE_QLOO_API_KEY: ${TASTE_QLOO_API_KEY:?set TASTE_QLOO_API_KEY in .env}
      TASTE_QLOO_BASE_URL: ${TASTE_QLOO_BASE_URL:-https://hackathon.api.qloo.com}
      TASTE_REDIS_ADDR: redis:6379
      TASTE_LOG_LEVEL: ${TASTE_LOG_LEVEL:-INFO}
      TASTE_GRPC_PORT: "9091"
      TASTE_SERVICE_NAME: service-taste
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # The slim image ships python; probe /health with the stdlib.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=3).status==200 else 1)",
        ]
      interval: 5s
      timeout: 4s
      retries: 5
      start_period: 8s

  # --- service-ai: Vertex AI, search grounding, pitch drafting. -----------
  # No `ports:` block on purpose: the gRPC listener stays on the Compose
  # network, so the model quota is not reachable from the host.
  service-ai:
    build:
      context: ../karum-service-ai
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # The recorded model pack ships in this repo; the container has no
      # sibling checkout, so it is mounted read-only (PLAN.md §4).
      - ./fixtures:/fixtures:ro
    environment:
      AI_PORT: "8082"
      AI_MODE: ${AI_MODE:-fixture}
      # Fixture mode (the default) replays the recorded pack under ./fixtures
      # and needs no credential. Set one of the two below only for live mode:
      # a Studio key and a Vertex project are two ways to reach the model,
      # not two requirements. A credential is never sent to the browser.
      AI_FIXTURES_DIR: /fixtures/ai
      AI_GEMINI_API_KEY: ${AI_GEMINI_API_KEY:-${GEMINI_API_KEY:-}}
      AI_GCP_PROJECT_ID: ${AI_GCP_PROJECT_ID:-}
      AI_GCP_LOCATION: ${AI_GCP_LOCATION:-us-central1}
      AI_GEMINI_MODEL: ${AI_GEMINI_MODEL:-gemini-3.8-flash}
      AI_LOG_LEVEL: ${AI_LOG_LEVEL:-INFO}
      AI_GRPC_PORT: "9092"
      AI_SERVICE_NAME: service-ai
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8082/health', timeout=3).status==200 else 1)",
        ]
      interval: 5s
      timeout: 4s
      retries: 5
      start_period: 8s

  # --- gateway: Go + Gin API gateway. ------------------------------------
  gateway:
    build:
      context: ../karum-server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      GATEWAY_PORT: "8080"
      GATEWAY_MODE: ${GATEWAY_MODE:-fixture}
      GATEWAY_VERSION: ${GATEWAY_VERSION:-local}
      # true shows the judge login banner that signs into the preseeded account.
      HACKATHON_MODE: ${HACKATHON_MODE:-false}
      JUDGE_EMAIL: ${JUDGE_EMAIL:-}
      JUDGE_PASSWORD: ${JUDGE_PASSWORD:-}
      JUDGE_DISPLAY_NAME: ${JUDGE_DISPLAY_NAME:-Karum Judge}
      SESSION_TTL: ${SESSION_TTL:-168h}
      # Point the gateway at the compose service names, not localhost.
      TASTE_ADDR: service-taste:8081
      AI_ADDR: service-ai:8082
      TASTE_GRPC_ADDR: service-taste:9091
      AI_GRPC_ADDR: service-ai:9092
      REDIS_ADDR: redis:6379
      POSTGRES_DSN: ${POSTGRES_DSN:?set POSTGRES_DSN in .env}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:?set GOOGLE_PLACES_API_KEY in .env}
      GOOGLE_ROUTES_API_KEY: ${GOOGLE_ROUTES_API_KEY:?set GOOGLE_ROUTES_API_KEY in .env}
      # Browser CORS allow-list. `make demo-refresh` writes the published
      # Firebase origin here; empty keeps the gateway's loopback dev fallback.
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-}
    depends_on:
      service-taste:
        condition: service_healthy
      service-ai:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # The runtime image is distroless (no shell/curl), so the binary probes
      # its own /health endpoint via the -healthcheck flag.
      test: ["CMD", "/gateway", "-healthcheck"]
      interval: 5s
      timeout: 4s
      retries: 5
      start_period: 8s

  # --- Caddy: public HTTPS on the demo VM. --------------------------------
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      KARUM_API_HOST: ${KARUM_API_HOST:?set KARUM_API_HOST to the sslip.io name}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  caddy-data:
  caddy-config:
