# Buf code-generation configuration.
#
# `buf generate` emits Go stubs for the gateway and Python stubs for the two
# microservices from the same proto source of truth. CI runs this inside Docker
# (see the contract job in .github/workflows/proto.yml) so laptop and CI stubs
# match. Every plugin is pinned to an exact BSR version — bump a pin the same
# way you would bump a dependency, and regenerate both stubs and the contract
# test in the same change.
#
# Outputs land in ../gen/ (git-ignored; regenerated by `make generate`):
#   gen/go/      Go packages, importable as
#                github.com/karum-labs/karum-infra/gen/go/karum/...
#   gen/python/  Python packages (kARUM_... modules and .pyi type stubs),
#                importable with gen/python on PYTHONPATH.
version: v2

plugins:
  # Go message stubs.
  - remote: buf.build/protocolbuffers/go:v1.36.12
    out: ../gen/go
    opt: paths=source_relative

  # Go gRPC service stubs.
  - remote: buf.build/grpc/go:v1.6.2
    out: ../gen/go
    opt: paths=source_relative

  # Python message stubs for service-taste and service-ai.
  - remote: buf.build/protocolbuffers/python:v36.2
    out: ../gen/python

  # Python type stubs so editors and type checkers see the generated messages.
  - remote: buf.build/protocolbuffers/pyi:v36.2
    out: ../gen/python

  # Python gRPC service stubs.
  - remote: buf.build/grpc/python:v1.84.0
    out: ../gen/python

managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/karum-labs/karum-infra/gen/go
