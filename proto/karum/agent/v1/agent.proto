syntax = "proto3";

// Package karum.agent.v1 is the campaign contract: campaign mode, job states,
// trace events, and the AI RPCs the gateway calls — menu audit, door pitch,
// and the LLM-only baseline.
//
// service-ai implements AgentService; the Go gateway is the only caller. Every
// response carries the model id, the prompt version, and the cited evidence
// ids (PLAN.md §3), plus a typed ErrorCode the gateway maps onto the degraded
// run state (PLAN.md §15, §18).
//
// Field comments carry the provenance marker convention documented in
// karum/common/v1/common.proto.
package karum.agent.v1;

import "google/protobuf/timestamp.proto";
import "karum/common/v1/common.proto";

// AgentService is implemented by service-ai and called by the Go gateway over
// gRPC.
service AgentService {
  // AuditMenu reads the venue website, menu, or delivery listing with Google
  // Search grounding and returns incumbents, a menu summary, the shelf inputs,
  // and the source URLs. Grounding is capped to the working shortlist
  // (PLAN.md §16).
  rpc AuditMenu(AuditMenuRequest) returns (AuditMenuResponse);

  // DraftDoorPitch writes the shopkeeper script, the displacement battlecard
  // when an incumbent is present, the recommended SKU, and the mode-specific
  // paragraph (PLAN.md §17).
  rpc DraftDoorPitch(DraftDoorPitchRequest) returns (DraftDoorPitchResponse);

  // LlmOnlyBaseline answers the same brand, city, and mode with no Qloo
  // payload; the client labels the panel ungrounded, and its venue names
  // source the free-entry skip candidates (PLAN.md §17).
  rpc LlmOnlyBaseline(LlmOnlyBaselineRequest) returns (LlmOnlyBaselineResponse);
}

// CampaignMode is the judge-facing mode pill (PLAN.md §1).
enum CampaignMode {
  // CAMPAIGN_MODE_UNSPECIFIED is unset; never sent on the wire.
  CAMPAIGN_MODE_UNSPECIFIED = 0;

  // CAMPAIGN_MODE_WHOLESALE ranks doors, audited menus, pitches, a field
  // route, and a run-sheet PDF.
  CAMPAIGN_MODE_WHOLESALE = 1;

  // CAMPAIGN_MODE_FLAGSHIP ranks corridor cells and anchor neighbours for a
  // flagship or pop-up, ending in a site-selection brief.
  CAMPAIGN_MODE_FLAGSHIP = 2;

  // CAMPAIGN_MODE_COLLAB restricts the place call to non-competing lifestyle
  // categories and ends in an activation proposal.
  CAMPAIGN_MODE_COLLAB = 3;
}

// JobState is the campaign job lifecycle (PLAN.md §1). The seed builder
// confirms entity ids before POST, so a job has no confirmation pause.
enum JobState {
  // JOB_STATE_UNSPECIFIED is unset; never sent on the wire.
  JOB_STATE_UNSPECIFIED = 0;

  // JOB_STATE_RESOLVING covers seed and tag resolution.
  JOB_STATE_RESOLVING = 1;

  // JOB_STATE_RUNNING covers scouting, enrichment, audits, scoring, and
  // drafts.
  JOB_STATE_RUNNING = 2;

  // JOB_STATE_READY means the campaign payload is complete and frozen.
  JOB_STATE_READY = 3;

  // JOB_STATE_DEGRADED means the run finished with at least one typed failure
  // (a failed draft, missing enrichment, or a cold upstream); the door list
  // is still served (PLAN.md §18).
  JOB_STATE_DEGRADED = 4;

  // JOB_STATE_FAILED means the run could not produce a door list.
  JOB_STATE_FAILED = 5;
}

// TraceStage names the hops the client timeline renders (PLAN.md §30).
enum TraceStage {
  // TRACE_STAGE_UNSPECIFIED is unset; never sent on the wire.
  TRACE_STAGE_UNSPECIFIED = 0;

  // TRACE_STAGE_GEOCODE resolves the city to one point.
  TRACE_STAGE_GEOCODE = 1;

  // TRACE_STAGE_SEED_RESOLUTION resolves the brand and vibe queries.
  TRACE_STAGE_SEED_RESOLUTION = 2;

  // TRACE_STAGE_TAG_RESOLUTION resolves the category and lifestyle chips.
  TRACE_STAGE_TAG_RESOLUTION = 3;

  // TRACE_STAGE_DOOR_RANKING ranks places for the seed.
  TRACE_STAGE_DOOR_RANKING = 4;

  // TRACE_STAGE_DEMOGRAPHICS fetches demographic profiles for the top doors.
  TRACE_STAGE_DEMOGRAPHICS = 5;

  // TRACE_STAGE_HEATMAP fetches the flagship density layer.
  TRACE_STAGE_HEATMAP = 6;

  // TRACE_STAGE_COMPARE runs the conquest comparison for an incumbent door.
  TRACE_STAGE_COMPARE = 7;

  // TRACE_STAGE_MENU_GROUNDING audits the live menu.
  TRACE_STAGE_MENU_GROUNDING = 8;

  // TRACE_STAGE_PLACES enriches the working set with address, hours, website,
  // and open status.
  TRACE_STAGE_PLACES = 9;

  // TRACE_STAGE_SCORING assembles the door composite and applies the
  // saturation rule.
  TRACE_STAGE_SCORING = 10;

  // TRACE_STAGE_ROUTE orders the qualified doors into the field route.
  TRACE_STAGE_ROUTE = 11;

  // TRACE_STAGE_DRAFT writes the pitches and the run-sheet inputs.
  TRACE_STAGE_DRAFT = 12;

  // TRACE_STAGE_BASELINE writes the LLM-only counterfactual.
  TRACE_STAGE_BASELINE = 13;

  // TRACE_STAGE_PERSIST stores the run and freezes the evidence snapshot.
  TRACE_STAGE_PERSIST = 14;
}

// TraceStatus is the outcome of one trace stage.
enum TraceStatus {
  // TRACE_STATUS_UNSPECIFIED is unset; never sent on the wire.
  TRACE_STATUS_UNSPECIFIED = 0;

  // TRACE_STATUS_STARTED marks a stage that is still running.
  TRACE_STATUS_STARTED = 1;

  // TRACE_STATUS_FINISHED marks a stage that completed.
  TRACE_STATUS_FINISHED = 2;

  // TRACE_STATUS_FAILED marks a stage that returned a typed failure.
  TRACE_STATUS_FAILED = 3;

  // TRACE_STATUS_SKIPPED marks a stage the mode or configuration skipped.
  TRACE_STATUS_SKIPPED = 4;
}

// ModelAttribution travels on every AI response (PLAN.md §3).
message ModelAttribution {
  // Input: the model id that wrote the response, e.g. "gemini-2.5-flash"; on
  // a degraded run it is "template", naming the deterministic fallback.
  string model_id = 1;

  // Input: the prompt template version, e.g. "draft-door-pitch@v1".
  string prompt_version = 2;

  // Input: the evidence ids the prose cites; a sentence whose cited id is
  // missing is dropped (PLAN.md §18).
  repeated string evidence_ids = 3;

  // Input: true only for the LlmOnlyBaseline counterfactual, which by
  // construction cites no Qloo evidence (PLAN.md §17).
  bool ungrounded = 4;
}

// TraceEvent is one timeline row, emitted as each hop finishes and replayed
// from the recorded trace when a stored preset is served (PLAN.md §19, §30).
message TraceEvent {
  // Input: the event id, unique inside a run.
  string id = 1;

  // Input: the gateway job id the event belongs to.
  string job_id = 2;

  // Input: the trace id shared with taste and AI log lines.
  string trace_id = 3;

  // Input: a monotonically increasing sequence number inside the run.
  int64 sequence = 4;

  // Input: the opaque resume cursor; a refreshed client replays from the last
  // cursor it stored (PLAN.md §19).
  string cursor = 5;

  // Input: the stage this event belongs to.
  TraceStage stage = 6;

  // Input: the stage's outcome.
  TraceStatus status = 7;

  // Input: true when the stage was served from the warm cache, so the
  // timeline can mark it (PLAN.md §30).
  bool cache_hit = 8;

  // Input: the stage's wall time in milliseconds.
  int32 elapsed_ms = 9;

  // Input: a short operator-readable line for the timeline row.
  string message = 10;

  // Input: when the event was emitted.
  google.protobuf.Timestamp occurred_at = 11;

  // Input: the failure classification when status is TRACE_STATUS_FAILED;
  // ERROR_CODE_UNSPECIFIED otherwise.
  karum.common.v1.ErrorCode error_code = 12;
}

// Sku is one entry of the brand's own product list.
message Sku {
  // Input: the brand-internal SKU id.
  string id = 1;

  // Input: the SKU display name, e.g. "Ilegal Mezcal Espadín Joven 750ml".
  string name = 2;
}

// BrandContext is the brand side of a draft request.
message BrandContext {
  // Input: the brand's display name as the seed builder supplied it; it may
  // echo a resolved Qloo entity name.
  string name = 1;

  // Input: the brand's own SKU list, plain text from the seed screen.
  repeated Sku skus = 2;
}

// GroundingSource is one citation the audit found; URLs are citations, never
// fetch targets (PLAN.md §42).
message GroundingSource {
  // Google fact: the source URL returned by Search grounding.
  string url = 1;

  // Google fact: the page title returned with the source.
  string title = 2;
}

// Incumbent is a competitor the audit found on the live menu or shelf. It is
// named only when a grounding source or the Qloo payload contains it
// (PLAN.md §16).
message Incumbent {
  // Google fact: the competitor name, present in the grounding sources.
  string name = 1;

  // Google fact: the grounding sources that name it.
  repeated GroundingSource sources = 2;
}

// MenuAuditTarget is one venue the audit covers; grounding is capped to the
// working shortlist, not the full take-25 pool (PLAN.md §16).
message MenuAuditTarget {
  // Qloo fact: the door row to audit.
  karum.common.v1.EntityRef door = 1;

  // Google fact: the website Places supplied; the audit's search hint.
  string website = 2;

  // Qloo fact: the door's taste tags, passed so the audit can reason about
  // the shelf fit.
  repeated karum.common.v1.Tag taste_tags = 3;

  // Input: true when the target is a skip candidate the skip rule might
  // cite, not a board door.
  bool skip_candidate = 4;
}

// MenuAuditResult is one venue's shelf read.
message MenuAuditResult {
  // Qloo fact: the audited door.
  karum.common.v1.EntityRef door = 1;

  // Model inference: whether the audit produced a usable read.
  bool succeeded = 2;

  // Model inference: true when no readable menu exists — an online-only or
  // unverifiable venue keeps its Qloo rank and the composite renormalizes
  // over affinity and demographics (PLAN.md §16).
  bool shelf_unknown = 3;

  // Google fact: the incumbents found on the live menu or shelf.
  repeated Incumbent incumbents = 4;

  // Model inference: how many direct niche competitors the audit counted;
  // four or more skip the door (PLAN.md §11).
  int32 competitor_count = 5;

  // Model inference: the 0–1 `O_shelf` input — 1.0 with no incumbent, each
  // direct niche competitor taking a quarter off (PLAN.md §11).
  double shelf_opportunity = 6;

  // Model inference: a short human-readable menu summary.
  string menu_summary = 7;

  // Google fact: the grounding URLs the summary cites; the card lists them as
  // clickable citations.
  repeated GroundingSource sources = 8;
}

// AuditMenuRequest names the working shortlist to audit.
message AuditMenuRequest {
  // Input: trace and job ids for log propagation.
  karum.common.v1.RequestMeta meta = 1;

  // Input: the campaign mode; collab audits partner venues.
  CampaignMode mode = 2;

  // Input: the venues to audit, capped to the working shortlist.
  repeated MenuAuditTarget targets = 3;
}

// AuditMenuResponse returns one result per target.
message AuditMenuResponse {
  // Model inference: the audit results, aligned to the request targets.
  repeated MenuAuditResult results = 1;

  // Input: the model id, prompt version, and cited evidence ids.
  ModelAttribution attribution = 2;

  // Input: the failure classification; ERROR_CODE_UNSPECIFIED on success.
  karum.common.v1.ErrorCode error_code = 3;

  // Input: the operator-readable explanation.
  string error_message = 4;
}

// DoorContext is the Qloo-derived context a pitch draws on. The gateway
// passes it so the draft carries evidence ids back to the drawer.
message DoorContext {
  // Qloo fact: the door's shared tags, used to pick the SKU.
  repeated karum.common.v1.Tag shared_tags = 1;

  // Qloo fact: the affinity bundle, raw value and percentile.
  karum.common.v1.SubScore affinity = 2;

  // Qloo fact: the overlap tags from CompareAudiences when an incumbent
  // exists; empty otherwise, and the battlecard then leans on affinity plus
  // the menu finding (PLAN.md §17).
  repeated karum.common.v1.Tag compare_tags = 3;

  // Model inference: the audit finding for this door.
  MenuAuditResult audit = 4;
}

// Battlecard is the displacement card attached when an incumbent is present.
message Battlecard {
  // Model inference: the one-line headline.
  string headline = 1;

  // Google fact: the incumbent the audit named.
  string incumbent_name = 2;

  // Model inference: short talking points, each citing an evidence id.
  repeated string talking_points = 3;

  // Model inference: the overlap summary using compare tags when they exist
  // and the affinity plus menu finding when they do not.
  string compare_summary = 4;
}

// DraftDoorPitchRequest asks for one door's pitch.
message DraftDoorPitchRequest {
  // Input: trace and job ids for log propagation.
  karum.common.v1.RequestMeta meta = 1;

  // Input: the campaign mode, selecting the mode-specific paragraph.
  CampaignMode mode = 2;

  // Input: the brand side of the pitch.
  BrandContext brand = 3;

  // Input: the door side of the pitch.
  DoorContext door = 4;

  // Input: the geocoded city label.
  string city = 5;

  // Input: a hard word cap per text so a judge can finish the read
  // (PLAN.md §17).
  int32 max_words = 6;
}

// DraftDoorPitchResponse returns the script and its supporting texts.
message DraftDoorPitchResponse {
  // Model inference: the shopkeeper script; every number cites an evidence id
  // (PLAN.md §17).
  string script = 1;

  // Model inference: the displacement battlecard, present only when the audit
  // found an incumbent.
  Battlecard battlecard = 2;

  // Model inference: the recommended SKU from the brand's own list, chosen
  // with the door's shared taste tags.
  Sku recommended_sku = 3;

  // Model inference: the mode-specific paragraph — the site-brief line in
  // flagship mode or the activation proposal in collab mode; empty in
  // wholesale.
  string mode_paragraph = 4;

  // Input: the model id, prompt version, and cited evidence ids.
  ModelAttribution attribution = 5;

  // Input: the failure classification; ERROR_CODE_UNSPECIFIED on success.
  karum.common.v1.ErrorCode error_code = 6;

  // Input: the operator-readable explanation.
  string error_message = 7;
}

// LlmOnlyBaselineRequest asks for the counterfactual with no Qloo payload.
message LlmOnlyBaselineRequest {
  // Input: trace and job ids for log propagation.
  karum.common.v1.RequestMeta meta = 1;

  // Input: the brand side of the question.
  BrandContext brand = 2;

  // Input: the geocoded city label.
  string city = 3;

  // Input: the campaign mode.
  CampaignMode mode = 4;

  // Input: a hard word cap for the baseline text.
  int32 max_words = 5;
}

// LlmOnlyBaselineResponse is the generic-LLM contrast stored beside the Qloo
// result and labeled ungrounded (PLAN.md §17).
message LlmOnlyBaselineResponse {
  // Model inference: the ungrounded baseline text.
  string text = 1;

  // Model inference: the venue names the baseline suggested; a free-entry run
  // resolves each through `/search` and records unresolved names as misses,
  // never scored (PLAN.md §11, §17).
  repeated string venue_names = 2;

  // Input: the model id, prompt version, and cited evidence ids; ungrounded
  // is always true here.
  ModelAttribution attribution = 3;

  // Input: the failure classification; ERROR_CODE_UNSPECIFIED on success.
  karum.common.v1.ErrorCode error_code = 4;

  // Input: the operator-readable explanation.
  string error_message = 5;
}
